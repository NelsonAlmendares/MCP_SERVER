[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-development-mcp"
version = "0.1.0"
description = "Internal Oracle development MCP server (Phase 1)"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9,<2", "pydantic-settings>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
